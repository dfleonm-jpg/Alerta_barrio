<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2b4c7e" />
  <meta name="description" content="Alerta Barrio - Consulta y reporta situaciones de inseguridad en tu zona de Bogotá." />
  <title>Alerta Barrio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>" />
  <style>
/* ==========================================================================
   Alerta Barrio — estilos (mobile-first, sin dependencias)
   Paleta inspirada en los wireframes del proyecto (azules suaves + acentos).
   ========================================================================== */
:root {
  --brand: #2b4c7e;
  --brand-2: #3f6ea5;
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #eef3fb;
  --text: #1c2733;
  --muted: #6b7683;
  --border: #e2e8f2;
  --alto: #e53935;
  --medio: #fb8c00;
  --bajo: #43a047;
  --radius: 16px;
  --shadow: 0 6px 20px rgba(31, 45, 61, 0.08);
  --shadow-sm: 0 2px 8px rgba(31, 45, 61, 0.06);
  --maxw: 480px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #dde3ee;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}

#app { min-height: 100vh; }

/* ------------------------- Splash ------------------------- */
.splash {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px;
  background: linear-gradient(160deg, var(--brand), #1d3557);
  color: #fff;
}
.splash-logo { font-size: 56px; }
.splash-name { font-size: 28px; font-weight: 800; letter-spacing: .3px; }
.splash-tag { opacity: .85; max-width: 300px; }

/* ------------------------- Shell / layout ------------------------- */
.shell {
  max-width: var(--maxw);
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  display: flex; flex-direction: column;
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,.12);
}

.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  background: var(--brand);
  color: #fff;
}
.appbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.appbar-pin { font-size: 20px; }
.appbar-reset {
  background: rgba(255,255,255,.15); color: #fff; border: none;
  width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer;
}
.appbar-reset:hover { background: rgba(255,255,255,.28); }

.content { flex: 1; padding: 16px 16px 96px; }

.view-head h1 { font-size: 22px; margin: 4px 0 2px; }
.section-title { font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 10px; }
.muted { color: var(--muted); }
.empty { text-align: center; padding: 24px 0; }

/* ------------------------- Bottom nav ------------------------- */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: var(--maxw);
  display: flex; justify-content: space-around;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index: 30;
}
.nav-item {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); font-size: 11px; padding: 4px;
}
.nav-icon { font-size: 20px; }
.nav-item.is-active { color: var(--brand); font-weight: 700; }

/* ------------------------- Search + chips ------------------------- */
.search {
  width: 100%; padding: 12px 14px; margin: 12px 0;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); font-size: 15px;
}
.search:focus { outline: 2px solid var(--brand-2); outline-offset: 1px; }

.legend { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
}
.chip.is-active { border-color: var(--brand); background: var(--surface-2); font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ------------------------- Map ------------------------- */
.map-box {
  width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius);
  overflow: hidden; box-shadow: var(--shadow); background: #eef2f6;
}
.map-box--mini { aspect-ratio: 16 / 10; margin-bottom: 12px; }
.map-svg { width: 100%; height: 100%; display: block; }
.map-marker { transition: transform .1s ease; transform-origin: center; }
.map-marker:hover, .map-marker:focus { transform: scale(1.25); outline: none; }

/* ------------------------- Zone list ------------------------- */
.zone-list { display: flex; flex-direction: column; gap: 10px; }
.zone-card {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px; cursor: pointer; width: 100%;
  box-shadow: var(--shadow-sm);
}
.zone-card:hover { border-color: var(--brand-2); }
.zone-badge {
  color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase;
  padding: 4px 8px; border-radius: 8px; min-width: 52px; text-align: center;
}
.zone-card-body { flex: 1; display: flex; flex-direction: column; }
.zone-card-name { font-weight: 600; }
.zone-card-meta { font-size: 13px; }
.zone-card-chevron { font-size: 22px; color: var(--muted); }

/* ------------------------- Report form ------------------------- */
.field { display: block; margin: 16px 0; }
.field-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
.field-input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--surface); font-size: 15px; font-family: inherit;
}
.field-input:focus { outline: 2px solid var(--brand-2); outline-offset: 1px; }

.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; cursor: pointer;
}
.option input { width: 18px; height: 18px; accent-color: var(--brand); }

.level-pills { display: flex; gap: 10px; }
.pill {
  flex: 1; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600;
  border: 2px solid var(--border); background: var(--surface); color: var(--text);
}
.pill.is-active { border-color: var(--pill); background: color-mix(in srgb, var(--pill) 14%, white); color: var(--pill); }

.form-feedback { min-height: 20px; margin: 6px 0; font-size: 14px; }
.form-feedback.is-error { color: var(--alto); font-weight: 600; }

/* ------------------------- Buttons ------------------------- */
.btn-primary {
  background: var(--brand); color: #fff; border: none; cursor: pointer;
  padding: 14px 18px; border-radius: 12px; font-size: 15px; font-weight: 600;
}
.btn-primary:hover { background: var(--brand-2); }
.btn-block { width: 100%; margin-top: 8px; }
.btn-ghost {
  background: transparent; color: var(--brand); border: 1px solid var(--border);
  padding: 12px 18px; border-radius: 12px; cursor: pointer; font-weight: 600;
}
.back-link { background: none; border: none; color: var(--brand); cursor: pointer; font-size: 15px; padding: 4px 0 8px; }

/* ------------------------- Success ------------------------- */
.success-card { text-align: center; padding: 32px 16px; }
.success-icon { font-size: 56px; }
.success-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

/* ------------------------- Zone view ------------------------- */
.risk-banner {
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--risk) 10%, white);
  border: 1px solid color-mix(in srgb, var(--risk) 30%, white);
  border-radius: 12px; padding: 12px 14px; margin: 6px 0 14px; font-size: 15px;
}
.risk-dot { width: 12px; height: 12px; border-radius: 50%; }
.stat-row { display: flex; gap: 12px; margin-bottom: 14px; }
.stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; box-shadow: var(--shadow-sm); }
.stat-value { font-size: 30px; font-weight: 800; color: var(--brand); }
.stat-label { font-size: 12px; }
.zone-desc { background: var(--surface-2); border-radius: 12px; padding: 14px; margin: 4px 0 4px; }

/* ------------------------- Incidents ------------------------- */
.incident-list, .alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.incident { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow-sm); }
.incident-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.incident-body { flex: 1; display: flex; flex-direction: column; }
.incident-title { font-weight: 600; }
.incident-note { font-size: 13px; }
.incident-time { font-size: 12px; white-space: nowrap; }

/* ------------------------- Alerts ------------------------- */
.alert-card { display: flex; align-items: stretch; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 12px 12px 0; cursor: pointer; box-shadow: var(--shadow-sm); overflow: hidden; }
.alert-card:hover { border-color: var(--brand-2); }
.alert-bar { width: 6px; border-radius: 6px; flex-shrink: 0; }
.alert-body { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 2px 0; }
.alert-title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.alert-emoji { font-size: 16px; }
.alert-meta { font-size: 12px; }
.alert-note { font-size: 13px; }

/* ------------------------- Desktop niceties ------------------------- */
@media (min-width: 520px) {
  .shell { margin-top: 20px; margin-bottom: 20px; min-height: calc(100vh - 40px); border-radius: 24px; overflow: hidden; }
  .bottom-nav { border-radius: 0 0 24px 24px; }
}


/* ------------------------- Ubicación + proximidad ------------------------- */
.loc-picker { margin: 12px 0 0; }
.loc-select { background: var(--surface-2); }

.proximity-banner {
  display: flex; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--risk) 12%, white);
  border: 1px solid color-mix(in srgb, var(--risk) 35%, white);
  border-left: 5px solid var(--risk);
  border-radius: 12px; padding: 12px 14px; margin: 12px 0 0;
  cursor: pointer; font-size: 14px;
}
.proximity-banner:hover { background: color-mix(in srgb, var(--risk) 18%, white); }
.proximity-icon { font-size: 18px; }
.proximity-text { flex: 1; }

/* ------------------------- Marcador de usuario / ruta ------------------------- */
.user-loc circle:first-child { animation: pulse 1.8s ease-out infinite; transform-origin: center; }
@keyframes pulse { 0% { opacity: .35; } 70% { opacity: .08; } 100% { opacity: .35; } }
.route-line { animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -5; } }

/* ------------------------- Vista de rutas ------------------------- */
.route-result { margin-top: 14px; }
.route-summary {
  background: color-mix(in srgb, var(--risk) 9%, white);
  border: 1px solid color-mix(in srgb, var(--risk) 28%, white);
  border-radius: 14px; padding: 14px; margin-bottom: 4px;
}
.route-summary-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.route-summary p { margin: 4px 0 0; font-size: 14px; }

.route-steps { list-style: none; margin: 0; padding: 0; position: relative; }
.route-steps::before {
  content: ''; position: absolute; left: 13px; top: 12px; bottom: 12px;
  width: 2px; background: var(--border);
}
.route-step {
  display: flex; align-items: center; gap: 12px; padding: 8px 6px; cursor: pointer;
  position: relative;
}
.route-step:hover .route-step-name { color: var(--brand); }
.route-step-dot {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
  border: 3px solid var(--bg); z-index: 1; margin-left: 6px;
}
.route-step.is-end .route-step-dot { width: 18px; height: 18px; margin-left: 4px; box-shadow: 0 0 0 2px var(--brand); }
.route-step-body { display: flex; flex-direction: column; }
.route-step-name { font-weight: 600; }
.route-step-meta { font-size: 12px; }


/* ------------------------- Iconos SVG (nav + marca) ------------------------- */
.appbar-brand svg { flex-shrink: 0; }
.nav-icon { display: inline-flex; align-items: center; justify-content: center; height: 24px; }
.nav-icon svg { display: block; }
.nav-item.is-active .nav-icon { color: var(--brand); }

  </style>
</head>

    </div>
  </div>

       para que funcione con doble clic (file://), por HTTP y en GitHub Pages. -->
  <script>
  (function () {
    'use strict';

/* ===== utils.js ===== */
// Pequeñas utilidades compartidas (sin dependencias).

// Tiempo relativo en español: "hace 20 min", "hace 3 h", "ayer"...
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.round(diff / 60000);
  if (min < 1) return 'ahora mismo';
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  if (d === 1) return 'ayer';
  return `hace ${d} días`;
}

// Escapa texto para insertarlo de forma segura en HTML.
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Crea un elemento del DOM con atributos e hijos.
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v !== null && v !== undefined && v !== false) {
      node.setAttribute(k, v);
    }
  }
  const kids = Array.isArray(children) ? children : [children];
  for (const c of kids) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}


/* ===== data.js ===== */
// ============================================================================
// Alerta Barrio — Capa de datos
// ----------------------------------------------------------------------------
// Modelo de datos, datos semilla (derivados de las entrevistas del proyecto)
// y persistencia en localStorage. Sin dependencias externas.
// ============================================================================

const STORAGE_KEY = 'alerta_barrio_v1';

// Tipos de incidente soportados (coinciden con el wireframe "Reportar alerta").
const INCIDENT_TYPES = [
  { id: 'robo', label: 'Robo', icon: '🚨' },
  { id: 'acoso', label: 'Acoso', icon: '⚠️' },
  { id: 'violencia', label: 'Violencia', icon: '🆘' },
  { id: 'iluminacion', label: 'Poca iluminación', icon: '💡' },
  { id: 'otro', label: 'Otro', icon: '❔' },
];

// Niveles de riesgo percibido.
const RISK_LEVELS = {
  alto: { id: 'alto', label: 'Alto', color: '#e53935', order: 3 },
  medio: { id: 'medio', label: 'Medio', color: '#fb8c00', order: 2 },
  bajo: { id: 'bajo', label: 'Bajo', color: '#43a047', order: 1 },
};
function levelFromScore(score) {
  if (score >= 7) return RISK_LEVELS.alto;
  if (score >= 4) return RISK_LEVELS.medio;
  return RISK_LEVELS.bajo;
}

// ----------------------------------------------------------------------------
// Zonas de Bogotá. Las coordenadas x/y son posiciones relativas (0..100) sobre
// nuestro mapa esquemático (SVG). lat/lng son aproximadas y solo informativas.
// Cada zona nace de un hallazgo real de las entrevistas del documento.
// ----------------------------------------------------------------------------
const SEED_ZONES = [
  {
    id: 'san-victorino',
    name: 'San Victorino / Plaza de la Mariposa',
    localidad: 'Santa Fe',
    x: 46, y: 55,
    baseScore: 9,
    descripcion:
      'Zona de comercio informal con alta afluencia. Los robos son frecuentes y la vigilancia es insuficiente, sobre todo al anochecer.',
  },
  {
    id: 'av-jimenez',
    name: 'Avenida Jiménez',
    localidad: 'La Candelaria',
    x: 50, y: 51,
    baseScore: 8,
    descripcion:
      'Calles con mucha congestión donde la aglomeración facilita los robos. Mayor riesgo durante la noche.',
  },
  {
    id: 'ricaurte',
    name: 'Estación Ricaurte / Calle 13',
    localidad: 'Los Mártires',
    x: 40, y: 57,
    baseScore: 8,
    descripcion:
      'Alrededores de la estación con poca vigilancia en algunos sectores. Riesgo al esperar transporte a solas de noche.',
  },
  {
    id: 'av-caracas-lourdes',
    name: 'Av. Caracas (Cll 60–72) / Parque Lourdes',
    localidad: 'Chapinero',
    x: 58, y: 40,
    baseScore: 8,
    descripcion:
      'Pasos peatonales temporales por obras del metro y andenes reducidos por ventas informales. Inseguridad permanente que se agrava de noche.',
  },
  {
    id: 'parque-timiza',
    name: 'Parque Timiza',
    localidad: 'Kennedy',
    x: 28, y: 74,
    baseScore: 7,
    descripcion:
      'Sin iluminación alrededor y muy solitario en la noche (7pm–3am). Difícil pedir ayuda si ocurre algo.',
  },
  {
    id: 'parque-tunal',
    name: 'Parque El Tunal y alrededores',
    localidad: 'Tunjuelito',
    x: 44, y: 80,
    baseScore: 6,
    descripcion:
      'Calles residenciales que quedan poco transitadas después de las 7 de la noche, con poca iluminación.',
  },
  {
    id: 'barrios-vecinos',
    name: 'Calles de barrios vecinos',
    localidad: 'Bogotá',
    x: 66, y: 66,
    baseScore: 6,
    descripcion:
      'Poca vigilancia al caer la tarde. Presencia reportada de ladrones de celulares en moto.',
  },
  {
    id: 'puentes-peatonales',
    name: 'Puentes peatonales y calles poco transitadas',
    localidad: 'Bogotá',
    x: 72, y: 52,
    baseScore: 5,
    descripcion:
      'Poca iluminación y falta de personas después de las 8 de la noche, especialmente al caminar solo.',
  },
];

// Genera una marca de tiempo hace N horas.
function hoursAgo(h) {
  return Date.now() - h * 60 * 60 * 1000;
}

// Reportes semilla, distribuidos entre las zonas para poblar el mapa de calor.
const SEED_INCIDENTS = [
  { zoneId: 'san-victorino', type: 'robo', level: 'alto', ts: hoursAgo(0.3), note: 'Robo de celular en plena plaza.' },
  { zoneId: 'san-victorino', type: 'acoso', level: 'medio', ts: hoursAgo(1), note: 'Acoso a transeúntes.' },
  { zoneId: 'san-victorino', type: 'robo', level: 'alto', ts: hoursAgo(3), note: 'Hurto a un vendedor.' },
  { zoneId: 'san-victorino', type: 'robo', level: 'alto', ts: hoursAgo(9) },
  { zoneId: 'av-jimenez', type: 'robo', level: 'alto', ts: hoursAgo(2), note: 'Cosquilleo en aglomeración.' },
  { zoneId: 'av-jimenez', type: 'robo', level: 'medio', ts: hoursAgo(6) },
  { zoneId: 'ricaurte', type: 'robo', level: 'alto', ts: hoursAgo(1.5), note: 'Robo cerca de la estación.' },
  { zoneId: 'ricaurte', type: 'otro', level: 'medio', ts: hoursAgo(8), note: 'Sujeto sospechoso rondando.' },
  { zoneId: 'av-caracas-lourdes', type: 'robo', level: 'alto', ts: hoursAgo(0.8), note: 'Hurto en paso temporal del metro.' },
  { zoneId: 'av-caracas-lourdes', type: 'iluminacion', level: 'medio', ts: hoursAgo(12), note: 'Tramo sin luz por obras.' },
  { zoneId: 'parque-timiza', type: 'iluminacion', level: 'alto', ts: hoursAgo(5), note: 'Parque totalmente a oscuras.' },
  { zoneId: 'parque-timiza', type: 'robo', level: 'medio', ts: hoursAgo(20) },
  { zoneId: 'parque-tunal', type: 'robo', level: 'medio', ts: hoursAgo(4), note: 'Robo a persona que regresaba a casa.' },
  { zoneId: 'parque-tunal', type: 'iluminacion', level: 'medio', ts: hoursAgo(15) },
  { zoneId: 'barrios-vecinos', type: 'robo', level: 'medio', ts: hoursAgo(7), note: 'Ladrones en moto.' },
  { zoneId: 'puentes-peatonales', type: 'iluminacion', level: 'bajo', ts: hoursAgo(10) },
  { zoneId: 'puentes-peatonales', type: 'otro', level: 'bajo', ts: hoursAgo(30) },
];

let _id = 1;
function nextId() {
  return `inc_${Date.now().toString(36)}_${(_id++).toString(36)}`;
}

// ----------------------------------------------------------------------------
// Estado en memoria + persistencia
// ----------------------------------------------------------------------------
function buildSeedState() {
  const incidents = SEED_INCIDENTS.map((i) => ({
    id: nextId(),
    zoneId: i.zoneId,
    type: i.type,
    level: i.level,
    note: i.note || '',
    ts: i.ts,
    source: 'seed',
  }));
  return { zones: SEED_ZONES, incidents };
}

let state = null;

function load() {
  if (state) return state;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Siempre reconciliamos con las zonas semilla (por si agregamos nuevas).
      const zoneMap = new Map(SEED_ZONES.map((z) => [z.id, z]));
      (parsed.zones || []).forEach((z) => zoneMap.set(z.id, z));
      state = { zones: [...zoneMap.values()], incidents: parsed.incidents || [] };
      return state;
    }
  } catch (e) {
    console.warn('No se pudo leer el almacenamiento local, usando datos semilla.', e);
  }
  state = buildSeedState();
  save();
  return state;
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('No se pudo guardar en el almacenamiento local.', e);
  }
}

// ----------------------------------------------------------------------------
// API pública de la capa de datos
// ----------------------------------------------------------------------------
function getZones() {
  return load().zones.slice();
}
function getZone(zoneId) {
  return load().zones.find((z) => z.id === zoneId) || null;
}
function getIncidents() {
  // Más recientes primero.
  return load().incidents.slice().sort((a, b) => b.ts - a.ts);
}
function getIncidentsForZone(zoneId) {
  return getIncidents().filter((i) => i.zoneId === zoneId);
}

// Cantidad de reportes por zona.
function countByZone(zoneId) {
  return load().incidents.filter((i) => i.zoneId === zoneId).length;
}

// Puntaje de riesgo dinámico de una zona: combina su base con los reportes
// recientes (últimas 24h pesan más). Devuelve un objeto con score y nivel.
function riskForZone(zoneId) {
  const zone = getZone(zoneId);
  if (!zone) return { score: 0, level: RISK_LEVELS.bajo };
  const now = Date.now();
  let bonus = 0;
  for (const inc of getIncidentsForZone(zoneId)) {
    const ageH = (now - inc.ts) / 3_600_000;
    const recency = ageH <= 24 ? 1 : ageH <= 72 ? 0.5 : 0.2;
    const weight = inc.level === 'alto' ? 1.2 : inc.level === 'medio' ? 0.7 : 0.3;
    bonus += recency * weight;
  }
  const score = Math.min(10, zone.baseScore * 0.6 + bonus);
  return { score, level: levelFromScore(score) };
}

// Añade un nuevo reporte. `report` = { zoneId, type, level, note }.
function addIncident(report) {
  const s = load();
  const incident = {
    id: nextId(),
    zoneId: report.zoneId,
    type: report.type,
    level: report.level,
    note: (report.note || '').trim(),
    ts: Date.now(),
    source: 'user',
  };
  s.incidents.push(incident);
  save();
  return incident;
}

// Alertas: zonas con reportes muy recientes (< 3h) o de nivel alto.
function getActiveAlerts() {
  const now = Date.now();
  return getIncidents()
    .filter((i) => now - i.ts <= 3 * 3_600_000 || i.level === 'alto')
    .slice(0, 20)
    .map((i) => ({ ...i, zone: getZone(i.zoneId) }));
}

// Reinicia todo a los datos semilla (útil para demostraciones).
function resetData() {
  state = buildSeedState();
  save();
  return state;
}
function typeMeta(typeId) {
  return INCIDENT_TYPES.find((t) => t.id === typeId) || INCIDENT_TYPES[INCIDENT_TYPES.length - 1];
}


/* ===== routes.js ===== */
// ============================================================================
// Motor de recomendación de rutas seguras.
// ----------------------------------------------------------------------------
// Construye un grafo de proximidad entre zonas (conecta las más cercanas) y
// calcula la ruta con menor "costo", donde el costo combina la distancia con
// una penalización por el nivel de riesgo de cada zona. Así la ruta sugerida
// prefiere pasar por zonas más seguras, aunque implique un pequeño rodeo.
// ============================================================================

// Distancia euclidiana en el plano del mapa (coordenadas 0..100).
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Construye la lista de adyacencia: cada zona se conecta con sus K vecinas
// más cercanas (grafo no dirigido). K pequeño = rutas más "de barrio".
function buildGraph(zones, k = 3) {
  const adj = new Map(zones.map((z) => [z.id, new Set()]));
  for (const z of zones) {
    const nearest = zones
      .filter((o) => o.id !== z.id)
      .map((o) => ({ id: o.id, d: dist(z, o) }))
      .sort((a, b) => a.d - b.d)
      .slice(0, k);
    for (const n of nearest) {
      adj.get(z.id).add(n.id);
      adj.get(n.id).add(z.id); // no dirigido
    }
  }
  return adj;
}

// Penalización de riesgo por zona (0..~20). Un score alto encarece pasar por ahí.
function riskPenalty(zoneId) {
  const { score } = riskForZone(zoneId);
  return score * score * 0.25; // cuadrático: castiga fuerte las zonas muy inseguras
}

/**
 * Dijkstra sobre el grafo de zonas.
 * @param {string} mode 'safe' (distancia + riesgo) | 'short' (solo distancia)
 * @returns {{path:string[], distance:number, riskSum:number}|null}
 */
function dijkstra(zones, adj, fromId, toId, mode) {
  const byId = new Map(zones.map((z) => [z.id, z]));
  const cost = new Map(zones.map((z) => [z.id, Infinity]));
  const prev = new Map();
  const visited = new Set();
  cost.set(fromId, 0);

  while (visited.size < zones.length) {
    // Nodo no visitado con menor costo.
    let u = null;
    let best = Infinity;
    for (const [id, c] of cost) {
      if (!visited.has(id) && c < best) { best = c; u = id; }
    }
    if (u === null) break;
    if (u === toId) break;
    visited.add(u);

    for (const v of adj.get(u)) {
      if (visited.has(v)) continue;
      const edge = dist(byId.get(u), byId.get(v));
      const penalty = mode === 'safe' ? riskPenalty(v) : 0;
      const nc = cost.get(u) + edge + penalty;
      if (nc < cost.get(v)) {
        cost.set(v, nc);
        prev.set(v, u);
      }
    }
  }

  if (!prev.has(toId) && fromId !== toId) return null;

  // Reconstruye el camino.
  const path = [toId];
  let cur = toId;
  while (cur !== fromId) {
    cur = prev.get(cur);
    if (cur === undefined) return null;
    path.unshift(cur);
  }

  // Métricas reales del camino.
  let distance = 0;
  let riskSum = 0;
  for (let i = 0; i < path.length; i++) {
    riskSum += riskForZone(path[i]).score;
    if (i > 0) distance += dist(byId.get(path[i - 1]), byId.get(path[i]));
  }
  return { path, distance, riskSum };
}

/**
 * Recomienda rutas entre dos zonas.
 * Devuelve { safe, short } con las métricas de cada una, más un texto de
 * comparación. `safe` evita zonas de alto riesgo; `short` es la más directa.
 */
function recommendRoutes(fromId, toId) {
  const zones = getZones();
  if (fromId === toId) return { error: 'El origen y el destino son la misma zona.' };
  const adj = buildGraph(zones);
  const safe = dijkstra(zones, adj, fromId, toId, 'safe');
  const short = dijkstra(zones, adj, fromId, toId, 'short');
  if (!safe || !short) return { error: 'No se encontró una ruta entre esas zonas.' };

  // Riesgo promedio por zona en cada ruta.
  safe.avgRisk = safe.riskSum / safe.path.length;
  short.avgRisk = short.riskSum / short.path.length;

  const saferBy = short.avgRisk - safe.avgRisk; // cuánto baja el riesgo
  const longerBy = safe.distance - short.distance; // cuánto se alarga
  const sameRoute = safe.path.join() === short.path.join();

  return { safe, short, saferBy, longerBy, sameRoute };
}

// ============================================================================
// Mapa esquemático de Bogotá dibujado en SVG (sin tiles externos → offline).
// Renderiza un mapa de calor y marcadores por nivel de riesgo.
// ============================================================================

const NS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

// Dibuja un fondo estilizado de ciudad: manzanas y avenidas principales.
function drawBackground(svg) {
  const bg = svgEl('rect', { x: 0, y: 0, width: 100, height: 100, fill: '#eef2f6' });
  svg.appendChild(bg);

  // Manzanas (grid tenue).
  const grid = svgEl('g', { opacity: '0.5' });
  for (let gx = 6; gx < 100; gx += 12) {
    for (let gy = 6; gy < 100; gy += 12) {
      grid.appendChild(
        svgEl('rect', {
          x: gx, y: gy, width: 8.5, height: 8.5, rx: 1.2,
          fill: '#dfe6ec', stroke: '#d3dce4', 'stroke-width': 0.2,
        })
      );
    }
  }
  svg.appendChild(grid);

  // "Cerros orientales" al oriente (derecha) — referencia geográfica de Bogotá.
  svg.appendChild(
    svgEl('path', {
      d: 'M100,0 L100,100 L84,100 C88,72 86,40 100,0 Z',
      fill: '#d7e4d0', opacity: '0.8',
    })
  );

  // Avenidas principales.
  const roads = svgEl('g', { stroke: '#ffffff', 'stroke-width': 1.6, 'stroke-linecap': 'round', fill: 'none' });
  roads.appendChild(svgEl('line', { x1: 0, y1: 45, x2: 100, y2: 40 }));   // horizontal
  roads.appendChild(svgEl('line', { x1: 52, y1: 0, x2: 48, y2: 100 }));   // vertical (Caracas)
  roads.appendChild(svgEl('line', { x1: 0, y1: 70, x2: 100, y2: 62 }));
  roads.appendChild(svgEl('line', { x1: 30, y1: 0, x2: 26, y2: 100 }));
  svg.appendChild(roads);
}

// Capa de calor: círculos difusos según nivel/score.
function drawHeat(svg, zones) {
  const heat = svgEl('g', { filter: 'url(#blur)' });
  for (const z of zones) {
    const { score, level } = riskForZone(z.id);
    const r = 6 + score * 1.4;
    heat.appendChild(
      svgEl('circle', {
        cx: z.x, cy: z.y, r, fill: level.color, opacity: 0.28,
      })
    );
  }
  svg.appendChild(heat);
}

/**
 * Renderiza el mapa dentro de `container`.
 * @param {HTMLElement} container
 * @param {(zoneId:string)=>void} onSelect  callback al tocar una zona
 * @param {string|object} opts  Filtro de nivel ('all'|'alto'|'medio'|'bajo')
 *   o un objeto de opciones:
 *   { filterLevel, routePath: string[], userPoint: {x,y}, highlight: string[] }
 */
function renderMap(container, onSelect, opts = 'all') {
  const options = typeof opts === 'string' ? { filterLevel: opts } : (opts || {});
  const filterLevel = options.filterLevel || 'all';
  const routePath = options.routePath || null;
  const userPoint = options.userPoint || null;
  const highlight = new Set(options.highlight || []);

  container.innerHTML = '';
  const zones = getZones();
  const byId = new Map(zones.map((z) => [z.id, z]));

  const svg = svgEl('svg', {
    viewBox: '0 0 100 100',
    class: 'map-svg',
    preserveAspectRatio: 'xMidYMid slice',
    role: 'img',
    'aria-label': 'Mapa de zonas de riesgo de Bogotá',
  });

  // Definición del desenfoque para el mapa de calor.
  const defs = svgEl('defs');
  const filter = svgEl('filter', { id: 'blur', x: '-50%', y: '-50%', width: '200%', height: '200%' });
  filter.appendChild(svgEl('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: '2.4' }));
  defs.appendChild(filter);
  svg.appendChild(defs);

  drawBackground(svg);
  drawHeat(svg, zones);

  // Ruta recomendada (polilínea que une las zonas del camino).
  if (routePath && routePath.length > 1) {
    const pts = routePath.map((id) => byId.get(id)).filter(Boolean);
    const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
    // Trazo blanco de fondo para dar contraste.
    svg.appendChild(svgEl('path', {
      d, fill: 'none', stroke: '#ffffff', 'stroke-width': 2.6,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    }));
    // Trazo azul de la ruta.
    svg.appendChild(svgEl('path', {
      d, fill: 'none', stroke: '#2b4c7e', 'stroke-width': 1.4,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      'stroke-dasharray': '3 2', class: 'route-line',
    }));
  }

  // Marcadores.
  for (const z of zones) {
    const { level } = riskForZone(z.id);
    if (filterLevel !== 'all' && level.id !== filterLevel && !highlight.has(z.id)) continue;

    const g = svgEl('g', { class: 'map-marker', tabindex: '0', role: 'button',
      'aria-label': `${z.name}, riesgo ${level.label}` });
    g.style.cursor = 'pointer';

    // Pin (gota).
    g.appendChild(
      svgEl('path', {
        d: `M ${z.x} ${z.y} c -2.6 -3.4 -3.9 -5 -3.9 -7 a 3.9 3.9 0 0 1 7.8 0 c 0 2 -1.3 3.6 -3.9 7 Z`,
        fill: level.color, stroke: '#ffffff', 'stroke-width': 0.5,
        transform: `translate(0 -1.5)`,
      })
    );
    g.appendChild(svgEl('circle', { cx: z.x, cy: z.y - 6.5, r: 1.4, fill: '#ffffff' }));

    const activate = () => onSelect && onSelect(z.id);
    g.addEventListener('click', activate);
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });

    // Resalta las zonas de la ruta o las marcadas.
    if (highlight.has(z.id)) {
      g.insertBefore(
        svgEl('circle', { cx: z.x, cy: z.y - 4, r: 5.2, fill: 'none', stroke: level.color, 'stroke-width': 0.9, opacity: 0.9 }),
        g.firstChild
      );
    }

    // Tooltip nativo.
    const title = svgEl('title');
    title.textContent = `${z.name} — ${countByZone(z.id)} reportes`;
    g.appendChild(title);

    svg.appendChild(g);
  }

  // Marcador de "mi ubicación" (punto azul pulsante).
  if (userPoint) {
    const u = svgEl('g', { class: 'user-loc' });
    u.appendChild(svgEl('circle', { cx: userPoint.x, cy: userPoint.y, r: 4.5, fill: '#1e88e5', opacity: 0.18 }));
    u.appendChild(svgEl('circle', { cx: userPoint.x, cy: userPoint.y, r: 2, fill: '#1e88e5', stroke: '#fff', 'stroke-width': 0.7 }));
    const t = svgEl('title'); t.textContent = 'Mi ubicación'; u.appendChild(t);
    svg.appendChild(u);
  }

  container.appendChild(svg);
}

// Utilidad: encuentra la zona más cercana a un punto {x,y} y su distancia.
function nearestZone(point) {
  const zones = getZones();
  let best = null;
  let bestD = Infinity;
  for (const z of zones) {
    const d = Math.hypot(z.x - point.x, z.y - point.y);
    if (d < bestD) { bestD = d; best = z; }
  }
  return { zone: best, distance: bestD };
}

// ---------------------------------------------------------------------------
// Router (#/mapa, #/reportar, #/zona/:id, #/alertas, #/rutas)
// ---------------------------------------------------------------------------
function parseRoute() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [name, param] = hash.split('/');
  return { name: name || 'mapa', param: param || null };
}

function navigate(path) {
  location.hash = path;
}

function render() {
  const { name, param } = parseRoute();
  let view, active;
  switch (name) {
    case 'reportar': view = ReportView(param); active = 'reportar'; break;
    case 'zona':     view = ZoneView(param);   active = 'mapa';     break;
    case 'rutas':    view = RoutesView();       active = 'rutas';    break;
    case 'alertas':  view = AlertsView();       active = 'alertas';  break;
    case 'mapa':
    default:         view = MapView();          active = 'mapa';     break;
  }

  app.innerHTML = '';
  const shell = el('div', { class: 'shell' }, [
    Header(),
    el('main', { class: 'content' }, [view]),
    BottomNav(active),
  ]);
  app.appendChild(shell);
  window.scrollTo(0, 0);
}

    el('option', { value: '' }, 'Selecciona la zona en el mapa…'),
    ...getZones().map((z) =>
      el('option', { value: z.id, ...(z.id === state.zoneId ? { selected: 'selected' } : {}) },
        `${z.name} (${z.localidad})`)
    ),
  ]);
  zoneSelect.addEventListener('change', () => { state.zoneId = zoneSelect.value; });

  // Tipo de incidente (radios).
  const typeGroup = el('div', { class: 'options' },
    INCIDENT_TYPES.map((t) =>
      OptionRadio('type', t.id, `${t.icon} ${t.label}`, t.id === state.type, (v) => (state.type = v))
    )
  );

  // Nivel percibido (chips).
  const levelGroup = el('div', { class: 'level-pills' },
    Object.values(RISK_LEVELS).sort((a, b) => a.order - b.order).map((lv) =>
      el('button', {
        type: 'button',
        class: `pill${lv.id === state.level ? ' is-active' : ''}`,
        style: `--pill:${lv.color}`,
        'data-level': lv.id,
        onclick: (e) => {
          state.level = lv.id;
          levelGroup.querySelectorAll('.pill').forEach((p) => p.classList.toggle('is-active', p === e.currentTarget));
        },
      }, lv.label)
    )
  );

  const note = el('textarea', {
    class: 'field-input', rows: '3', maxlength: '200',
    placeholder: 'Describe brevemente lo ocurrido (opcional)…',
  });
  note.addEventListener('input', () => (state.note = note.value));

  const feedback = el('div', { class: 'form-feedback', 'aria-live': 'polite' });

  const submit = el('button', { class: 'btn-primary btn-block' }, 'Enviar reporte');
  submit.addEventListener('click', () => {
    if (!state.zoneId) {
      feedback.textContent = 'Selecciona una zona antes de enviar.';
      feedback.classList.add('is-error');
      zoneSelect.focus();
      return;
    }
    addIncident(state);
    const zone = getZone(state.zoneId);
    feedback.classList.remove('is-error');
    wrap.innerHTML = '';
    wrap.appendChild(SuccessCard(zone));
  });

  wrap.append(
    el('div', { class: 'view-head' }, [
      el('h1', {}, 'Reportar alerta'),
      el('p', { class: 'muted' }, 'Registra la ubicación, el tipo de incidente y el nivel de riesgo.'),
    ]),
    el('label', { class: 'field' }, [ el('span', { class: 'field-label' }, '📍 Ubicación'), zoneSelect ]),
    el('div', { class: 'field' }, [ el('span', { class: 'field-label' }, 'Tipo de incidente'), typeGroup ]),
    el('div', { class: 'field' }, [ el('span', { class: 'field-label' }, 'Nivel percibido'), levelGroup ]),
    el('label', { class: 'field' }, [ el('span', { class: 'field-label' }, 'Detalle'), note ]),
    feedback,
    submit,
  );
  return wrap;
}

function OptionRadio(name, value, label, checked, onChange) {
  const input = el('input', { type: 'radio', name, value, ...(checked ? { checked: 'checked' } : {}) });
  input.addEventListener('change', () => onChange(value));
  return el('label', { class: 'option' }, [ input, el('span', {}, label) ]);
}

function SuccessCard(zone) {
  return el('div', { class: 'success-card' }, [
    el('div', { class: 'success-icon' }, '✅'),
    el('h2', {}, '¡Reporte enviado!'),
    el('p', { class: 'muted' }, zone
      ? `Tu reporte en “${zone.name}” fue registrado y el mapa de calor se actualizó.`
      : 'Tu reporte fue registrado.'),
    el('div', { class: 'success-actions' }, [
      zone ? el('button', { class: 'btn-primary', onclick: () => navigate(`zona/${zone.id}`) }, 'Ver la zona') : null,
      el('button', { class: 'btn-ghost', onclick: () => navigate('mapa') }, 'Volver al mapa'),
    ]),
  ]);
}

// ---------------------------------------------------------------------------
// Vista 3 — Información de zona
// ---------------------------------------------------------------------------
function ZoneView(zoneId) {
  const zone = getZone(zoneId);
  const wrap = el('div', { class: 'view view-zone' });
  if (!zone) {
    wrap.append(
      el('p', { class: 'muted' }, 'Zona no encontrada.'),
      el('button', { class: 'btn-ghost', onclick: () => navigate('mapa') }, '‹ Volver al mapa'),
    );
    return wrap;
  }

  const { level } = riskForZone(zone.id);
  const incidents = getIncidentsForZone(zone.id);

  const miniMap = el('div', { class: 'map-box map-box--mini' });
  setTimeout(() => renderMap(miniMap, (id) => navigate(`zona/${id}`), 'all'), 0);

  wrap.append(
    el('button', { class: 'back-link', onclick: () => navigate('mapa') }, '‹ Volver al mapa'),
    el('div', { class: 'view-head' }, [
      el('h1', {}, zone.name),
      el('p', { class: 'muted' }, zone.localidad),
    ]),
    miniMap,
    el('div', { class: 'risk-banner', style: `--risk:${level.color}` }, [
      el('span', { class: 'risk-dot', style: `background:${level.color}` }),
      el('span', {}, [ 'Nivel de riesgo: ', el('strong', { style: `color:${level.color}` }, level.label) ]),
    ]),
    el('div', { class: 'stat-row' }, [
      Stat(String(incidents.length), 'Reportes en la zona'),
      Stat(String(incidents.filter((i) => Date.now() - i.ts <= 24 * 3600000).length), 'En las últimas 24 h'),
    ]),
    el('p', { class: 'zone-desc' }, zone.descripcion),
    el('h2', { class: 'section-title' }, 'Últimos reportes'),
    IncidentList(incidents),
    el('button', {
      class: 'btn-primary btn-block', onclick: () => navigate(`reportar/${zone.id}`),
    }, '➕ Reportar en esta zona'),
  );
  return wrap;
}

function Stat(value, label) {
  return el('div', { class: 'stat' }, [
    el('div', { class: 'stat-value' }, value),
    el('div', { class: 'stat-label muted' }, label),
  ]);
}

function IncidentList(incidents) {
  if (!incidents.length) {
    return el('p', { class: 'muted empty' }, 'Aún no hay reportes en esta zona.');
  }
  return el('ul', { class: 'incident-list' },
    incidents.slice(0, 15).map((i) => {
      const t = typeMeta(i.type);
      const color = RISK_LEVELS[i.level].color;
      return el('li', { class: 'incident' }, [
        el('span', { class: 'incident-icon', style: `background:${color}22;color:${color}` }, t.icon),
        el('span', { class: 'incident-body' }, [
          el('span', { class: 'incident-title' }, t.label),
          i.note ? el('span', { class: 'incident-note muted' }, i.note) : null,
        ]),
        el('span', { class: 'incident-time muted' }, timeAgo(i.ts)),
      ]);
    })
  );
}

// ---------------------------------------------------------------------------
// Vista 4 — Alertas
// ---------------------------------------------------------------------------
function AlertsView() {
  const wrap = el('div', { class: 'view view-alerts' });
  const alerts = getActiveAlerts();

  wrap.append(
    el('div', { class: 'view-head' }, [
      el('h1', {}, 'Alertas'),
      el('p', { class: 'muted' }, 'Incidentes recientes o de nivel alto cerca de las zonas monitoreadas.'),
    ]),
  );

  if (!alerts.length) {
    wrap.appendChild(el('p', { class: 'muted empty' }, 'No hay alertas activas por ahora.'));
    return wrap;
  }

  wrap.appendChild(
    el('ul', { class: 'alert-list' },
      alerts.map((a) => {
        const t = typeMeta(a.type);
        const color = RISK_LEVELS[a.level].color;
        return el('li', {
          class: 'alert-card', onclick: () => a.zone && navigate(`zona/${a.zone.id}`),
        }, [
          el('span', { class: 'alert-bar', style: `background:${color}` }),
          el('span', { class: 'alert-body' }, [
            el('span', { class: 'alert-title' }, [
              el('span', { class: 'alert-emoji' }, t.icon),
              `${t.label} — ${a.zone ? a.zone.name : 'Zona'}`,
            ]),
            el('span', { class: 'alert-meta muted' }, `${RISK_LEVELS[a.level].label} · ${timeAgo(a.ts)}`),
            a.note ? el('span', { class: 'alert-note muted' }, a.note) : null,
          ]),
          el('span', { class: 'zone-card-chevron' }, '›'),
        ]);
      })
    )
  );
  return wrap;
}

// ---------------------------------------------------------------------------
// Ubicación simulada + alertas de proximidad
// ---------------------------------------------------------------------------
function LocationPicker(onChange) {
  const select = el('select', { class: 'field-input loc-select', 'aria-label': 'Mi ubicación' }, [
    el('option', { value: '' }, '📍 Simular mi ubicación…'),
    ...getZones().map((z) =>
      el('option', { value: z.id, ...(z.id === userLocationZoneId ? { selected: 'selected' } : {}) }, z.name)
    ),
  ]);
  select.addEventListener('change', () => {
    userLocationZoneId = select.value || null;
    onChange && onChange();
  });
  return el('div', { class: 'loc-picker' }, [select]);
}

// Umbral de proximidad (en unidades del mapa 0..100).
const PROXIMITY_RADIUS = 18;

function renderProximity(host) {
  host.innerHTML = '';
  if (!userLocationZoneId) return;
  const userZone = getZone(userLocationZoneId);
  if (!userZone) return;

  const { zone, distance } = nearestZone({ x: userZone.x, y: userZone.y });
  // Evalúa el riesgo de la propia zona del usuario.
  const own = riskForZone(userZone.id);
  // Y busca la zona de alto riesgo más cercana dentro del radio.
  let nearbyHigh = null;
  let nearbyD = Infinity;
  for (const z of getZones()) {
    if (z.id === userZone.id) continue;
    const d = Math.hypot(z.x - userZone.x, z.y - userZone.y);
    const r = riskForZone(z.id);
    if (r.level.id === 'alto' && d <= PROXIMITY_RADIUS && d < nearbyD) {
      nearbyD = d; nearbyHigh = { zone: z, risk: r };
    }
  }

  if (own.level.id === 'alto') {
    host.appendChild(ProximityBanner('alto',
      `Estás en una zona de riesgo ALTO: ${userZone.name}. Mantente atento y evita mostrar objetos de valor.`,
      userZone.id));
  } else if (nearbyHigh) {
    host.appendChild(ProximityBanner('alto',
      `Cerca de una zona de riesgo alto: ${nearbyHigh.zone.name}. Considera una ruta más segura.`,
      nearbyHigh.zone.id));
  } else if (own.level.id === 'medio') {
    host.appendChild(ProximityBanner('medio',
      `Tu zona (${userZone.name}) tiene un riesgo medio. Precaución al desplazarte.`,
      userZone.id));
  } else {
    host.appendChild(ProximityBanner('bajo',
      `Tu zona (${userZone.name}) se percibe con riesgo bajo por ahora.`,
      userZone.id));
  }
}

function ProximityBanner(level, text, zoneId) {
  const color = RISK_LEVELS[level].color;
  const icon = level === 'alto' ? '🔴' : level === 'medio' ? '🟠' : '🟢';
  return el('div', {
    class: 'proximity-banner', style: `--risk:${color}`,
    onclick: () => zoneId && navigate(`zona/${zoneId}`),
    role: 'button', tabindex: '0',
  }, [
    el('span', { class: 'proximity-icon' }, icon),
    el('span', { class: 'proximity-text' }, text),
  ]);
}

// ---------------------------------------------------------------------------
// Vista 5 — Rutas seguras
// ---------------------------------------------------------------------------
function RoutesView() {
  const wrap = el('div', { class: 'view view-routes' });
  const zones = getZones();
  const state = { from: userLocationZoneId || zones[0].id, to: '' };

  const buildSelect = (label, key, includeEmpty) => {
    const sel = el('select', { class: 'field-input', 'aria-label': label }, [
      includeEmpty ? el('option', { value: '' }, 'Selecciona el destino…') : null,
      ...zones.map((z) =>
        el('option', { value: z.id, ...(z.id === state[key] ? { selected: 'selected' } : {}) },
          `${z.name} (${z.localidad})`)
    ),
    ].filter(Boolean));
    sel.addEventListener('change', () => { state[key] = sel.value; update(); });
    return sel;
  };

  const mapBox = el('div', { class: 'map-box' });
  const result = el('div', { class: 'route-result' });

  const update = () => {
    if (!state.to || !state.from) {
      renderMap(mapBox, (id) => navigate(`zona/${id}`), 'all');
      result.innerHTML = '';
      result.appendChild(el('p', { class: 'muted' }, 'Elige un origen y un destino para ver la ruta más segura.'));
      return;
    }
    const rec = recommendRoutes(state.from, state.to);
    if (rec.error) {
      renderMap(mapBox, (id) => navigate(`zona/${id}`), 'all');
      result.innerHTML = '';
      result.appendChild(el('p', { class: 'muted' }, rec.error));
      return;
    }
    // Dibuja la ruta segura sobre el mapa.
    renderMap(mapBox, (id) => navigate(`zona/${id}`), {
      filterLevel: 'all', routePath: rec.safe.path, highlight: rec.safe.path,
    });
    paintRouteResult(result, rec, zones);
  };

  wrap.append(
    el('div', { class: 'view-head' }, [
      el('h1', {}, 'Rutas seguras'),
      el('p', { class: 'muted' }, 'Te sugerimos el recorrido que evita las zonas de mayor riesgo.'),
    ]),
    el('label', { class: 'field' }, [ el('span', { class: 'field-label' }, '🟢 Origen'), buildSelect('Origen', 'from', false) ]),
    el('label', { class: 'field' }, [ el('span', { class: 'field-label' }, '🏁 Destino'), buildSelect('Destino', 'to', true) ]),
    mapBox,
    result,
  );

  setTimeout(update, 0);
  return wrap;
}

function paintRouteResult(container, rec, zones) {
  const byId = new Map(zones.map((z) => [z.id, z]));
  container.innerHTML = '';

  const { safe, saferBy, longerBy, sameRoute } = rec;
  const avgLevel =
    safe.avgRisk >= 7 ? RISK_LEVELS.alto : safe.avgRisk >= 4 ? RISK_LEVELS.medio : RISK_LEVELS.bajo;

  // Resumen.
  container.appendChild(
    el('div', { class: 'route-summary', style: `--risk:${avgLevel.color}` }, [
      el('div', { class: 'route-summary-head' }, [
        el('span', { class: 'risk-dot', style: `background:${avgLevel.color}` }),
        el('strong', {}, `Ruta recomendada · riesgo ${avgLevel.label.toLowerCase()}`),
      ]),
      el('p', { class: 'muted' },
        sameRoute
          ? 'La ruta más directa ya es también la más segura disponible.'
          : `Esta ruta reduce el riesgo promedio ${saferBy.toFixed(1)} puntos${longerBy > 0.5 ? `, con un pequeño rodeo` : ''} frente a la más directa.`),
    ])
  );

  // Pasos.
  container.appendChild(el('h2', { class: 'section-title' }, `Recorrido (${safe.path.length} zonas)`));
  container.appendChild(
    el('ol', { class: 'route-steps' },
      safe.path.map((id, i) => {
        const z = byId.get(id);
        const r = riskForZone(id);
        const isEnd = i === 0 || i === safe.path.length - 1;
        return el('li', { class: `route-step${isEnd ? ' is-end' : ''}`, onclick: () => navigate(`zona/${id}`) }, [
          el('span', { class: 'route-step-dot', style: `background:${r.level.color}` }),
          el('span', { class: 'route-step-body' }, [
            el('span', { class: 'route-step-name' }, z ? z.name : id),
            el('span', { class: 'route-step-meta muted' }, `${z ? z.localidad : ''} · riesgo ${r.level.label.toLowerCase()}`),
          ]),
        ]);
      })
    )
  );
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  // Da un instante al splash y arranca.
  setTimeout(render, 250);
});
// Si el DOM ya está listo (module carga tarde), renderiza igual.
if (document.readyState !== 'loading') setTimeout(render, 250);


  })();
  </script>
